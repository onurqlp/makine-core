name: MAKİNE — Autonomous Read-Only Coordination

on:
  schedule:
    - cron: '17 * * * *'      # Hourly source coordination, best effort UTC
    - cron: '41 4 * * *'      # Daily full 57-model source research, best effort UTC
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Also refresh the full 57-model source catalogue'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/coordination.yml'
      - 'makine/coordinator.py'
      - 'tests/test_coordination.py'
      - 'makine/agent.py'
      - 'tests/test_agent.py'
      - 'makine/taskboard.py'
      - 'tests/test_taskboard.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: makine-core-coordination-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run existing and new safety/contract tests
        run: |
          python -m unittest discover -s tests -q
          node --check site/app.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class JS(HTMLParser):
              def __init__(self):
                  super().__init__();self.on=False;self.out=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script' and not dict(attrs).get('src'):self.on=True
              def handle_endtag(self,tag):
                  if tag=='script':self.on=False
              def handle_data(self,data):
                  if self.on:self.out.append(data)
          p=JS();p.feed(Path('site/status.html').read_text(encoding='utf-8'))
          assert p.out and 'function init()' in ''.join(p.out)
          Path('/tmp/makine-status.js').write_text('\n'.join(p.out))
          PY
          node --check /tmp/makine-status.js
      - name: Read immutable COIN.LIVE and ALTI public snapshots and coordinate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m makine.coordinator
      - name: Daily/explicit broader 57-model market research (never trades)
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 4 * * *') || (github.event_name == 'workflow_dispatch' && inputs.full_refresh == true) }}
        env:
          MAKINE_SCHEDULED_REFRESH: '1'
        run: python -m makine refresh
      - name: Optional approved daily AI research synthesis (never on push)
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 4 * * *') || (github.event_name == 'workflow_dispatch' && inputs.full_refresh == true) }}
        env:
          MAKINE_AI_ENABLED: ${{ vars.MAKINE_AI_ENABLED }}
          MAKINE_AI_MODEL: ${{ vars.MAKINE_AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m makine.agent
      - name: Build deduplicated task board and comment only on state transitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m makine.taskboard
      - name: Check outputs and keep an auditable hourly log
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path("site/data/coordination.json").read_text())
          h=json.loads(pathlib.Path("data/coordination-history.json").read_text())
          assert d["schema"]=="makine-coordination-v1"
          assert d["mode"]=="AUTOMATED_READ_ONLY"
          assert not any((d["controls"][k] for k in ("place_real_orders", "place_paper_orders", "source_repo_writes", "promote_live_signals")))
          assert h["entries"] and len(h["entries"]) <= 336
          t=json.loads(pathlib.Path("site/data/task-board.json").read_text())
          assert t["schema"]=="makine-task-board-v1"
          assert t["automation"]["cross_repository_writes"] is False
          assert t["automation"]["allow_trading"] is False
          assert pathlib.Path("site/status.html").is_file()
          assert t["issue_delivery"]["state"] in ("POSTED", "UNCHANGED", "TOKEN_UNAVAILABLE", "REPO_SCOPE_REJECTED", "FAILED_RETRY_NEXT_RUN")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## MAKİNE coordinated snapshot\n")
              out.write(f"- State: **{d['system_state']}**\n")
              for k,v in d["sources"].items():
                  out.write(f"- {k}: **{v['state']}** · {v.get('observed_at_utc') or 'unavailable'}\n")
              out.write("- Research only; AI runtime state is documented in coordination.json; no trading or source-repo writes.\n")
          PY
      - name: Commit MAKİNE-only read-only coordination reports
        run: |
          git config user.name "MAKİNE Research Worker"
          git config user.email "makine-core-bot@users.noreply.github.com"
          git add site/data/coordination.json data/coordination-history.json site/data/task-board.json
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "41 4 * * *" ]; then
            git add data/update-history.json site/data/report.json site/data/coinlive-handoff.json site/data/update-history.json
            if [ -f site/data/agent-analysis.json ]; then git add site/data/agent-analysis.json; fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_refresh }}" = "true" ]; then
            git add data/update-history.json site/data/report.json site/data/coinlive-handoff.json site/data/update-history.json
            if [ -f site/data/agent-analysis.json ]; then git add site/data/agent-analysis.json; fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: unattended MAKİNE evidence snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  pages:
    needs: coordinate
    if: ${{ needs.coordinate.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: makine-core-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Detect optional GitHub Pages setting
        id: check_pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl -sSL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; no fake public deploy."
          fi
      - name: Configure Pages
        if: steps.check_pages.outputs.active == 'true'
        uses: actions/configure-pages@v5
      - name: Upload MAKİNE dashboard and snapshots
        if: steps.check_pages.outputs.active == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish latest MAKİNE to GitHub Pages
        id: deployment
        if: steps.check_pages.outputs.active == 'true'
        uses: actions/deploy-pages@v4
