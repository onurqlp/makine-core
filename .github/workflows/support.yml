name: MAKİNE — Six Module COIN.LIVE Support
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'
      - 'data/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: makine-six-support
  cancel-in-progress: false
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Six-module contract tests
        run: |
          python -m unittest discover -s tests -q
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self):super().__init__();self.collect=False;self.s=[]
              def handle_starttag(self,t,a):
                  if t=='script' and not dict(a).get('src'):self.collect=True
              def handle_endtag(self,t):
                  if t=='script':self.collect=False
              def handle_data(self,d):
                  if self.collect:self.s.append(d)
          p=P();p.feed(Path('site/index.html').read_text())
          assert p.s
          Path('/tmp/makine.js').write_text('\n'.join(p.s))
          PY
          node --check /tmp/makine.js
      - name: Build six source-gated support modules (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m makine.bridge
      - name: Verify only nonexecutable support exports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('site/data/support.json').read_text())
          f=json.loads(Path('site/data/coinlive-support.json').read_text())
          assert s['module_count']==6
          assert [m['id'] for m in s['modules']]==['A1','A2','A3','B1','B2','T0']
          assert not f['orders'] and not f['change_signals'] and not f['change_paper_ledger']
          assert f['requires_explicit_coinlive_integration']
          assert all(not m['executable'] and not m['signal'] for m in s['modules'])
          PY
      - name: Record MAKİNE-only latest export
        run: |
          git config user.name 'MAKİNE Support Worker'
          git config user.email 'makine-core-bot@users.noreply.github.com'
          git add site/data/support.json site/data/coinlive-support.json data/support-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: six-module COIN.LIVE support export [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  pages:
    needs: support
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
